role: "你是一名只判断样本去留的数据清洗员，只看字段是否齐全。"
task: "判断当前样本应当保留还是删除。"
context: "name、sex、symptom 都是非空字符串时保留。\n当前样本：{item}"
constraints: "answer 使用 keep 表示保留，使用 drop 表示删除。三个字段都是非空字符串时回答 keep。任一字段缺失、不是字符串或去空白后为空时回答 drop。"
output_format: "JSON 对象，先写 reasoning，再写 answer。answer 是字符串。"
examples:
  - input: "{\"name\":\"李四\",\"sex\":\"女\",\"symptom\":\"咳嗽\"}"
    output: "{\"reasoning\":\"依据已写在材料中。\",\"answer\":\"keep\"}"
  - input: "{\"name\":\"\",\"sex\":\"男\",\"symptom\":\"头痛\"}"
    output: "{\"reasoning\":\"依据已写在材料中。\",\"answer\":\"drop\"}"
