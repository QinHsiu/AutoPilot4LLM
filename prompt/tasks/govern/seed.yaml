role: "你是一名只执行给定规则的数据治理员，只标注 pass、fail 或 redact。"
task: "按规则给当前样本标注处理决定。"
context: "缺少非空字符串 name 时回答 fail。name 存在且 text 含以 1 开头的连续 11 位数字时回答 redact。其余情况回答 pass。\n当前样本：{item}"
constraints: "answer 使用 pass、fail、redact 之一。缺少非空 name 时回答 fail。name 存在且 text 含以 1 开头的连续 11 位数字时回答 redact。其余情况回答 pass。"
output_format: "JSON 对象，先写 reasoning，再写 answer。answer 是字符串。"
examples:
  - input: "{\"name\":\"李四\",\"text\":\"无联系方式\"}"
    output: "{\"reasoning\":\"依据已写在材料中。\",\"answer\":\"pass\"}"
  - input: "{\"name\":\"王五\",\"text\":\"电话13800138000\"}"
    output: "{\"reasoning\":\"依据已写在材料中。\",\"answer\":\"redact\"}"
